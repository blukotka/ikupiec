<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LAB B — TODO list</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Lista TODO — LAB B</h1>

    <label class="search-wrap">
      <input id="search" type="search" placeholder="Szukaj (min. 2 znaki)..." />
    </label>

    <div id="todo-list" class="todo-list" aria-live="polite"></div>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="new-text" type="text" placeholder="Nowe zadanie (3–255 znaków)" maxlength="255" />
      <input id="new-due" type="datetime-local" />
      <button id="add-btn" type="submit">Dodaj</button>
    </form>

  </main>

  <script src="script.js" defer></script>
</body>
</html>
